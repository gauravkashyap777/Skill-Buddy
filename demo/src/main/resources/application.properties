# =========================================================
# SERVER
# =========================================================
server.port=8081

# =========================================================
# MYSQL DATASOURCE
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/skillbuddy?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=6450
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================================
# JWT
# =========================================================
skillbuddy.jwt.secret=ChangeMeToAVeryLongSecretKeyForHS256AtLeast32Chars
skillbuddy.jwt.expiration=604800000

# =========================================================
# CORS
# =========================================================
skillbuddy.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8080,http://localhost:8081